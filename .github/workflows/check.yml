# Pack the package as npm would publish it, install it into each example as a user would, and run
# them: Node (require and import), the TypeScript declarations under tsc --noEmit, and the plain page
# in headless Firefox. On every push and pull request, and by hand before a publish.
name: Install check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global typescript@5.9.3
      - name: Pack, install into the examples, run them
        run: |
          TMPDIR=$RUNNER_TEMP TSC=tsc ./scripts/check-examples.sh | tee check.log
      - name: The page, in headless Firefox
        run: |
          python3 scripts/check-browser.py "$(sed -n 's/^browser: //p' check.log)"
