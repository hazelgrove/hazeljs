# Build the package's hazel-lib.js from a commit of hazelgrove/hazel, on GitHub's machines
# (scripts/build.sh), and push it to a branch of its own, build/<commit>, with package.json's
# "hazel" field naming the commit. Merge that branch to take the new build; a release then
# publishes it. Run by hand: Actions, "Build hazel-lib.js", Run workflow.
name: Build hazel-lib.js
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "The hazelgrove/hazel commit to build"
        required: true
      branch:
        description: "Its branch, for package.json (empty: keep the one recorded)"
        required: false
      pr:
        description: "Its pull request's URL, for package.json (empty: keep the one recorded)"
        required: false
      editor:
        description: "Build Hazel's editor too, into editor/ (hazelgrove/hazeljs#2)"
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      # Hazel at the workspace root, as its toolchain action expects; this package beside it
      - uses: actions/checkout@v4
        with:
          repository: hazelgrove/hazel
          ref: ${{ inputs.commit }}
      - uses: actions/checkout@v4
        with:
          path: pkg
      - uses: ./.github/actions/setup-hazel-toolchain
      - name: Build hazel-lib.js and record its commit
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
          BRANCH: ${{ inputs.branch }}
          PR: ${{ inputs.pr }}
          EDITOR: ${{ inputs.editor && '1' || '' }}
          # (the editor's build-info rule looks up the branch's pull request, as in Hazel's Deploy workflow)
          GH_TOKEN: ${{ github.token }}
        run: ./pkg/scripts/build.sh . "$COMMIT" "$BRANCH" "$PR" | tee build.log
      - name: Push it to a branch of its own
        shell: bash
        run: |
          cd pkg
          short=$(node -p "require('./package.json').hazel.commit.slice(0, 10)")
          # (with the editor, build/<commit>-editor)
          name="build/$short"; if [ -d editor ]; then name="$name-editor"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$name"
          git add hazel-lib.js package.json
          if [ -d editor ]; then git add -f editor; fi
          git commit -m "hazel-lib.js$( [ -d editor ] && echo " and Hazel's editor") built from hazelgrove/hazel at $short, on GitHub's machines (the Build hazel-lib.js workflow)"
          git push origin "$name"
          { echo '## Build hazel-lib.js'; echo '```'; cat ../build.log; echo "branch: $name"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
